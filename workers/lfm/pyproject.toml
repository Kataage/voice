[project]
name = "personavoice-worker-lfm"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.0,<5",
  "huggingface-hub>=1.3,<2",
  "peft>=0.17,<1",
  "torch>=2.8,<2.13",
  "transformers>=5.2,<6",
  "trl>=0.29,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.8,<2.13"]
cu128 = ["torch>=2.8,<2.13"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
