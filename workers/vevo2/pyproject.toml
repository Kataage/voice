[project]
name = "personavoice-worker-vevo2"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.10.1",
  "einops==0.8.1",
  "huggingface-hub==0.36.0",
  "ipython==8.37.0",
  "json5==0.12.1",
  "librosa==0.10.2",
  "numpy==1.26.4",
  "openai-whisper==20250625",
  "praat-parselmouth==0.4.6",
  "pyworld==0.3.5",
  "ruamel.yaml==0.18.16",
  "safetensors==0.6.2",
  "scipy==1.13.1",
  "soundfile==0.12.1",
  "torch==2.4.0",
  "torchcrepe==0.0.24",
  "torchaudio==2.4.0",
  "torchvision==0.19.0",
  "tqdm==4.67.1",
  "transformers==4.46.3",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
cpu = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
]
cu124 = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
