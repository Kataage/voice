[project]
name = "personavoice-worker-seed-vc"
version = "0.2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
  "scipy==1.13.1",
  "librosa==0.10.2",
  "huggingface-hub>=0.28.1,<1",
  "munch==4.0.0",
  "einops==0.8.0",
  "descript-audio-codec==1.0.0",
  "pydub==0.25.1",
  "resemblyzer",
  "jiwer==3.0.3",
  "transformers==4.46.3",
  "soundfile==0.12.1",
  "modelscope==1.18.1",
  "funasr==1.1.5",
  "numpy==1.26.4",
  "hydra-core==1.3.2",
  "pyyaml",
  "python-dotenv",
]

[project.optional-dependencies]
cpu = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
]
cu124 = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
