[project]
name = "personavoice"
version = "0.3.1"
description = "Local-first orchestration for consented voice persona training and inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<1",
  "hf-xet>=1.1,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=14.0,<15",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
persona = "personavoice.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personavoice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501", # embedded local UI contains long HTML/JS lines
  "B008", # Typer intentionally uses Option(...) in command signatures
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
