name: core-ci

on:
  push:
    branches: [main, feat/personavoice-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync core environment
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: CLI smoke test
        run: uv run persona --help
