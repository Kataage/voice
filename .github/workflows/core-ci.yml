name: core-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Sync core environment
        run: uv sync --dev --locked
      - name: Modal remains optional in the default environment
        run: >-
          uv run --locked python -c
          "import importlib.util; assert importlib.util.find_spec('modal') is None"
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: CLI smoke test
        run: uv run --locked persona --help
      - name: Issue 26 contracts (locked Modal SDK and credential-free fake transport)
        run: >-
          uv run --locked --extra modal pytest
          tests/test_training_config_migration.py
          tests/test_environment_loading.py
          tests/test_training_plan.py
          tests/test_training_input_reuse.py
          tests/test_training_bundle.py
          tests/test_training_executors.py
          tests/test_modal_transport.py
          tests/test_modal_app.py
          tests/test_common_training_runner.py
          tests/test_training_artifacts.py
          tests/test_training_state_v9.py
          tests/test_quality_gate.py
          tests/test_evaluation_metrics.py
          tests/test_evaluation_publication.py
          tests/test_irodori_full_training.py
          tests/test_lfm_full_training.py
          tests/test_full_inference_selection.py
          tests/test_cli_issue26_contract.py
          tests/test_operational_training_status.py
      - name: Validate POSIX lock maintenance script syntax
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: sh -n scripts/lock_all.sh
      - name: Validate PowerShell lock maintenance script syntax
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/lock_all.ps1)) | Out-Null'

  worker-envs:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        worker: [asr, diarization, sense, lfm, seed_vc, vevo2]
        include:
          - worker: asr
            extra: ''
            gpu_extra: ''
            legacy_gpu_extra: ''
          - worker: diarization
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
            legacy_gpu_extra: '--extra cu126'
          - worker: sense
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
            legacy_gpu_extra: '--extra cu126'
          - worker: lfm
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
            legacy_gpu_extra: '--extra cu126'
          - worker: seed_vc
            extra: '--extra cpu'
            gpu_extra: '--extra cu124'
            legacy_gpu_extra: ''
          - worker: vevo2
            extra: '--extra cpu'
            gpu_extra: '--extra cu124'
            legacy_gpu_extra: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Install compatible Python runtimes
        shell: bash
        run: uv python install 3.10 3.12
      - name: Sync locked worker environment
        shell: bash
        run: uv sync --project "workers/${{ matrix.worker }}" --locked ${{ matrix.extra }}
      - name: Compile worker entrypoints
        shell: bash
        run: |
          project="workers/${{ matrix.worker }}"
          uv run --project "$project" --no-sync python -m compileall -q "$project"
      - name: Validate diarization ABI dependency contract
        if: ${{ matrix.worker == 'diarization' }}
        shell: bash
        run: |
          project="workers/${{ matrix.worker }}"
          uv run --project "$project" --no-sync python -c "from importlib.metadata import version; import torch, torchaudio; assert torch.__version__.split('+')[0] == torchaudio.__version__.split('+')[0] == '2.10.0'; assert version('torchcodec') == '0.10.0'; assert version('pyannote.audio') == '4.0.7'"
      - name: Validate SenseVoice runtime imports
        if: ${{ matrix.worker == 'sense' }}
        shell: bash
        run: |
          project="workers/${{ matrix.worker }}"
          uv run --project "$project" --no-sync python -c "import torch, torchaudio; from funasr import AutoModel; assert torch.__version__.split('+')[0] == torchaudio.__version__.split('+')[0]"
      - name: Validate LFM trainer API
        if: ${{ matrix.worker == 'lfm' }}
        shell: bash
        run: |
          project="workers/${{ matrix.worker }}"
          uv run --project "$project" --no-sync python -c "import sys; from pathlib import Path; from transformers import TrainerCallback; sys.path.insert(0, '$project'); import train; c=train._sft_config(run_dir=Path('.runtime/ci-lfm'), epochs=1.0, batch=1, grad_accum=1, learning_rate=2e-5, has_cuda=False, use_bf16=False, save_steps=1); callback=train._CheckpointMethodMarkerCallback('full'); assert c.completion_only_loss is True and c.use_cpu is True and c.save_only_model is False and c.enable_jit_checkpoint is True and c.max_length == 2048 and isinstance(callback, TrainerCallback)"
      - name: Validate locked GPU extra
        if: ${{ matrix.gpu_extra != '' }}
        shell: bash
        run: uv sync --project "workers/${{ matrix.worker }}" --locked --dry-run ${{ matrix.gpu_extra }}
      - name: Validate locked Pascal GPU extra
        if: ${{ matrix.legacy_gpu_extra != '' }}
        shell: bash
        run: uv sync --project "workers/${{ matrix.worker }}" --locked --dry-run ${{ matrix.legacy_gpu_extra }}

  irodori-lock:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Materialize pinned Irodori dependency overlay
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/Aratako/Irodori-TTS.git vendor/Irodori-TTS
          git -C vendor/Irodori-TTS checkout --detach 8224dafb46d0aba89209a8f905f1cb7e3299d9c1
          cp locks/Irodori-TTS.pyproject.toml vendor/Irodori-TTS/pyproject.toml
          cp locks/Irodori-TTS.uv.lock vendor/Irodori-TTS/uv.lock
      - name: Validate CPU lock
        shell: bash
        run: uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cpu
      - name: Validate Pascal CUDA 12.6 lock
        shell: bash
        run: uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cu126
      - name: Validate modern CUDA 12.8 lock
        shell: bash
        run: uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cu128
