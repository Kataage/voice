name: core-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Sync core environment
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: CLI smoke test
        run: uv run --locked persona --help

  worker-envs:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        worker: [asr, diarization, sense, lfm, seed_vc]
        include:
          - worker: asr
            extra: ''
            gpu_extra: ''
          - worker: diarization
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
          - worker: sense
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
          - worker: lfm
            extra: '--extra cpu'
            gpu_extra: '--extra cu128'
          - worker: seed_vc
            extra: '--extra cpu'
            gpu_extra: '--extra cu124'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Install compatible Python runtimes
        shell: bash
        run: uv python install 3.10 3.12
      - name: Sync locked worker environment
        shell: bash
        run: uv sync --project "workers/${{ matrix.worker }}" --locked ${{ matrix.extra }}
      - name: Compile worker entrypoints
        shell: bash
        run: |
          project="workers/${{ matrix.worker }}"
          uv run --project "$project" --no-sync python -m compileall -q "$project"
      - name: Validate locked GPU extra
        if: ${{ matrix.gpu_extra != '' }}
        shell: bash
        run: uv sync --project "workers/${{ matrix.worker }}" --locked --dry-run ${{ matrix.gpu_extra }}
