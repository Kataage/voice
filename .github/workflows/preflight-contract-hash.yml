name: preflight-contract-hash

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/pascal-ffmpeg-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pascal-ffmpeg-runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Apply CUDA preflight contract fingerprint
        run: python scripts/_ci_preflight_contract_hash.py
      - name: Validate root suite
        run: |
          uv sync --dev --locked
          uv run --locked ruff check src tests workers
          uv run --locked pytest
          uv run --locked python -m compileall -q src tests workers
      - name: Commit CUDA preflight contract fingerprint
        shell: bash
        run: |
          git rm scripts/_ci_preflight_contract_hash.py .github/workflows/preflight-contract-hash.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: fingerprint CUDA preflight policy"
          git push origin HEAD:fix/pascal-ffmpeg-runtime
