name: regenerate-sense-lock

on:
  push:
    branches: [fix/sense-torchaudio]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/sense-torchaudio
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install audited uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Regenerate SenseVoice lock
        run: uv lock --project workers/sense
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- workers/sense/uv.lock; then
            echo "SenseVoice lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/sense/uv.lock
          git commit -m "chore: regenerate sense worker lock"
          git push origin HEAD:fix/sense-torchaudio
