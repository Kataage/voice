name: apply-evaluation-embedding-fix

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-evaluation-embedding-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - name: Patch evaluation speaker embedding handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/personavoice/evaluation.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def _identity(")
          end = text.index("\ndef _transcript(", start)
          helper = '''def _best_effort_embeddings(
              repo_root: Path,
              items: list[dict[str, str]],
              *,
              label: str,
          ) -> tuple[dict[str, dict[str, Any]], dict[str, str]]:
              """Collect independent pyannote embeddings while failing quality closed.

              A short or effectively non-speech generated sample can yield an
              undefined/non-finite centroid. Worker schema validation must keep
              rejecting that value, but one bad sample must not erase the other
              evaluation metrics. Missing speaker metrics remain None, so the
              publication quality gate still fails closed.
              """

              diarization = worker(repo_root, "diarization")
              results: dict[str, dict[str, Any]] = {}
              errors: dict[str, str] = {}
              for item in items:
                  item_id = str(item.get("id") or "")
                  audio = item.get("audio")
                  if not item_id or not isinstance(audio, str) or not audio:
                      if item_id:
                          errors[item_id] = f"{label}: invalid-request"
                      continue
                  try:
                      value = diarization.call(repo_root, "embed", {"audio": audio})
                  except Exception as exc:
                      reason = (
                          "invalid-response-schema"
                          if "invalid response schema" in str(exc).casefold()
                          else type(exc).__name__
                      )
                      errors[item_id] = f"{label}: {reason}"
                      continue
                  embedding = value.get("embedding") if isinstance(value, dict) else None
                  if not isinstance(embedding, list) or not embedding:
                      errors[item_id] = f"{label}: empty-embedding"
                      continue
                  results[item_id] = value
              return results, errors


          def _identity(
              repo_root: Path,
              paths: PersonaPaths,
          ) -> tuple[list[float] | None, dict[str, str]]:
              refs = [
                  path
                  for path in paths.identity.rglob("*")
                  if path.is_file()
                  and path.suffix.lower() in {".wav", ".flac", ".mp3", ".m4a", ".ogg", ".opus"}
              ][:5]
              if not refs:
                  return None, {}
              results, errors = _best_effort_embeddings(
                  repo_root,
                  [
                      {"id": str(index), "audio": str(path.resolve())}
                      for index, path in enumerate(refs)
                  ],
                  label="identity",
              )
              embeddings = [
                  result["embedding"] for result in results.values() if result.get("embedding")
              ]
              return (mean_embedding(embeddings) if embeddings else None), errors

          '''
          import textwrap
          text = text[:start] + textwrap.dedent(helper) + text[end + 1:]

          old = '''    target_embedding = _identity(repo_root, paths)
          '''
          new = '''    target_embedding, identity_embedding_errors = _identity(repo_root, paths)
          '''
          if text.count(old) != 1:
              raise SystemExit("target embedding call changed unexpectedly")
          text = text.replace(old, new)

          old = '''    diar_response = worker(repo_root, "diarization").call(
              repo_root,
              "batch",
              {"embeddings": analyzed_items, "diarizations": []},
          )
          embeddings = _successful(
              diar_response.get("embeddings") or [],
              label="evaluation speaker embedding",
          )
          '''
          new = '''    embeddings, speaker_embedding_errors = _best_effort_embeddings(
              repo_root,
              analyzed_items,
              label="evaluation",
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("bulk evaluation embedding block changed unexpectedly")
          text = text.replace(old, new)

          text = text.replace(
              '''            embedding = embeddings[candidate_id].get("embedding")
          ''',
              '''            embedding = embeddings.get(candidate_id, {}).get("embedding")
          ''',
              1,
          )
          text = text.replace(
              '''                embedding = embeddings[item_id].get("embedding")
          ''',
              '''                embedding = embeddings.get(item_id, {}).get("embedding")
          ''',
              1,
          )

          old = '''                "speaker_similarity": speaker_score,
              "detected_emotion": acoustic.get("emotion"),
          '''
          new = '''                "speaker_similarity": speaker_score,
              "speaker_embedding_error": speaker_embedding_errors.get(candidate_id),
              "detected_emotion": acoustic.get("emotion"),
          '''
          if text.count(old) < 1:
              raise SystemExit("candidate case speaker row changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''                    "speaker_similarity": speaker_score,
                  "detected_emotion": acoustic.get("emotion"),
          '''
          new = '''                    "speaker_similarity": speaker_score,
                  "speaker_embedding_error": speaker_embedding_errors.get(item_id),
                  "detected_emotion": acoustic.get("emotion"),
          '''
          if text.count(old) < 1:
              raise SystemExit("mode case speaker row changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        "candidate_cer_mean": candidate_mean,
              }
          '''
          new = '''        "candidate_cer_mean": candidate_mean,
              "speaker_embedding_diagnostics": {
                  "identity": identity_embedding_errors,
                  "generated": speaker_embedding_errors,
              },
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("voice report return changed unexpectedly")
          text = text.replace(old, new)

          old = '''        "candidate_cer_mean": voice_report["candidate_cer_mean"],
              "lfm": lfm_report,
          '''
          new = '''        "candidate_cer_mean": voice_report["candidate_cer_mean"],
              "speaker_embedding_diagnostics": voice_report.get("speaker_embedding_diagnostics", {}),
              "lfm": lfm_report,
          '''
          if text.count(old) != 1:
              raise SystemExit("final evaluation report changed unexpectedly")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile src/personavoice/evaluation.py tests/test_evaluation_embedding_failures.py
          git diff --check
          ! grep -q '"batch".*embeddings' src/personavoice/evaluation.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personavoice/evaluation.py tests/test_evaluation_embedding_failures.py
          git commit -m "fix: isolate evaluation speaker embedding failures"
          git push origin HEAD:26-feature
