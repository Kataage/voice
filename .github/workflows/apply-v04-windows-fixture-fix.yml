name: apply-v04-windows-fixture-fix

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-v04-windows-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Patch canonical v0.3 fixture newlines
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_training_config_migration.py")
          text = path.read_text(encoding="utf-8")
          fn = text.index("def test_v03_artifact_adoption_requires_exact_completed_input_and_config_lineage")
          end = text.index("\ndef test_v03_checkpoint_is_losslessly_seeded", fn)
          section = text[fn:end]

          old = '\'{"audio":"a.flac","text":"hello"}\\n\', encoding="utf-8"'
          new = '\'{"audio":"a.flac","text":"hello"}\\n\', encoding="utf-8", newline="\\n"'
          if section.count(old) != 1:
              raise SystemExit("Irodori fixture write changed unexpectedly")
          section = section.replace(old, new, 1)

          old = '        encoding="utf-8",\n    )'
          new = '        encoding="utf-8",\n        newline="\\n",\n    )'
          if section.count(old) != 3:
              raise SystemExit(f"expected three LFM fixture writes, found {section.count(old)}")
          section = section.replace(old, new)

          path.write_text(text[:fn] + section + text[end:], encoding="utf-8", newline="\n")
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          uv sync --dev --locked
          uv run --locked pytest tests/test_training_config_migration.py::test_v03_artifact_adoption_requires_exact_completed_input_and_config_lineage
          uv run --locked ruff check tests/test_training_config_migration.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_training_config_migration.py
          git commit -m "test: make v0.3 lineage fixture platform-independent"
          git push origin HEAD:26-feature
