name: pascal-lock-refresh

on:
  push:
    branches: [fix/pascal-ffmpeg-runtime]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pascal-ffmpeg-runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Apply audited integration patches
        run: |
          python scripts/_ci_pascal_patch.py
          python scripts/_ci_pascal_followup.py
      - name: Regenerate worker locks
        run: |
          uv lock --project workers/diarization
          uv lock --project workers/sense
          uv lock --project workers/lfm
      - name: Regenerate managed Irodori lock
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/Aratako/Irodori-TTS.git vendor/Irodori-TTS
          git -C vendor/Irodori-TTS checkout --detach 8224dafb46d0aba89209a8f905f1cb7e3299d9c1
          cp locks/Irodori-TTS.pyproject.toml vendor/Irodori-TTS/pyproject.toml
          uv lock --project vendor/Irodori-TTS
          cp vendor/Irodori-TTS/uv.lock locks/Irodori-TTS.uv.lock
      - name: Validate generated CUDA contracts
        shell: bash
        run: |
          uv sync --project workers/diarization --locked --dry-run --extra cpu
          uv sync --project workers/diarization --locked --dry-run --extra cu126
          uv sync --project workers/diarization --locked --dry-run --extra cu128
          uv sync --project workers/sense --locked --dry-run --extra cpu
          uv sync --project workers/sense --locked --dry-run --extra cu126
          uv sync --project workers/sense --locked --dry-run --extra cu128
          uv sync --project workers/lfm --locked --dry-run --extra cpu
          uv sync --project workers/lfm --locked --dry-run --extra cu126
          uv sync --project workers/lfm --locked --dry-run --extra cu128
          uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cpu
          uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cu126
          uv sync --project vendor/Irodori-TTS --locked --dry-run --extra cu128
      - name: Sync root test environment
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: Commit audited generated locks
        shell: bash
        run: |
          rm -rf vendor/Irodori-TTS
          git rm scripts/_ci_pascal_patch.py scripts/_ci_pascal_followup.py .github/workflows/pascal-lock-refresh.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: support Pascal CUDA and shared FFmpeg"
          git push origin HEAD:fix/pascal-ffmpeg-runtime
