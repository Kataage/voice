name: pr17-crossplatform-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/post-pr15-runtime-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-pr15-runtime-hardening
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Apply cross-platform fix
        run: python scripts/_ci_pr17_crossplatform_fix.py
      - name: Sync root test environment
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: Commit integrated fix
        shell: bash
        run: |
          git rm scripts/_ci_pr17_crossplatform_fix.py .github/workflows/pr17-crossplatform-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: allow setup to reauthorize compatible FFmpeg"
          git push origin HEAD:fix/post-pr15-runtime-hardening
