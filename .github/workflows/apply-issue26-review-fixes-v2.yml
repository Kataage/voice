name: apply-issue26-review-fixes-v2

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-issue26-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - name: Apply reviewed runtime fixes
        shell: python
        run: |
          import re
          from pathlib import Path

          worker = Path("workers/lfm/worker.py")
          text = worker.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''(?m)^    input_ids = tokenizer\.apply_chat_template\(\n'''
              r'''        messages,\n'''
              r'''        add_generation_prompt=True,\n'''
              r'''        tokenize=True,\n'''
              r'''        return_tensors="pt",\n'''
              r'''    \)\.to\(model\.device\)\n'''
              r'''    output = model\.generate\(\n'''
              r'''        input_ids,\n'''
              r'''        \*\*_generation_kwargs\(payload\),\n'''
              r'''    \)\n'''
              r'''    generated = output\[0, input_ids\.shape\[-1\] :\]\n'''
          )
          replacement = '''    inputs = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              tokenize=True,
              return_tensors="pt",
              return_dict=True,
          ).to(model.device)
          input_ids = inputs.get("input_ids")
          if input_ids is None or not hasattr(input_ids, "shape"):
              raise RuntimeError("LFM chat template did not return tensor input_ids")
          output = model.generate(
              **inputs,
              **_generation_kwargs(payload),
          )
          generated = output[0, input_ids.shape[-1] :]
          '''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"expected one legacy LFM inference block, found {count}")
          worker.write_text(text, encoding="utf-8")

          test = Path("tests/test_lfm_worker_hardening.py")
          text = test.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    class FakeInput:
              shape = (1, 3)

              def to(self, device):
                  assert device == "cpu"
                  return self
          ''',
                  '''    class FakeTensor:
              shape = (1, 3)

          class FakeBatchEncoding(dict):
              def to(self, device):
                  assert device == "cpu"
                  return self
          ''',
              ),
              (
                  '''            assert kwargs["add_generation_prompt"] is True
              return FakeInput()
          ''',
                  '''            assert kwargs == {
                  "add_generation_prompt": True,
                  "tokenize": True,
                  "return_tensors": "pt",
                  "return_dict": True,
              }
              return FakeBatchEncoding(
                  input_ids=FakeTensor(),
                  attention_mask=FakeTensor(),
              )
          ''',
              ),
              (
                  '''        def generate(self, input_ids, **kwargs):
              assert isinstance(input_ids, FakeInput)
              generated_with.update(kwargs)
              return FakeOutput()
          ''',
                  '''        def generate(self, **kwargs):
              assert isinstance(kwargs.pop("input_ids"), FakeTensor)
              assert isinstance(kwargs.pop("attention_mask"), FakeTensor)
              generated_with.update(kwargs)
              return FakeOutput()
          ''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("expected exactly one legacy LFM test fragment")
              text = text.replace(old, new)
          test.write_text(text, encoding="utf-8")
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/lfm/worker.py tests/test_lfm_worker_hardening.py
          git diff --cached --check
          git commit -m "fix: handle LFM BatchEncoding inference"
          git push origin HEAD:26-feature
