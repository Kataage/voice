name: apply-issue26-review-fixes

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-issue26-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - name: Apply reviewed runtime fixes
        shell: python
        run: |
          from pathlib import Path

          worker = Path("workers/lfm/worker.py")
          text = worker.read_text(encoding="utf-8")
          old = '''    input_ids = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              tokenize=True,
              return_tensors="pt",
          ).to(model.device)
          output = model.generate(
              input_ids,
              **_generation_kwargs(payload),
          )
          generated = output[0, input_ids.shape[-1] :]
          '''
          new = '''    inputs = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              tokenize=True,
              return_tensors="pt",
              return_dict=True,
          ).to(model.device)
          input_ids = inputs.get("input_ids")
          if input_ids is None or not hasattr(input_ids, "shape"):
              raise RuntimeError("LFM chat template did not return tensor input_ids")
          output = model.generate(
              **inputs,
              **_generation_kwargs(payload),
          )
          generated = output[0, input_ids.shape[-1] :]
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy LFM inference block")
          worker.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/test_lfm_worker_hardening.py")
          text = test.read_text(encoding="utf-8")
          start = text.index("def test_lfm_zero_temperature_uses_deterministic_generation")
          end = text.index("\ndef test_lfm_download_refuses_incomplete_materialization", start)
          replacement = '''def test_lfm_zero_temperature_uses_deterministic_generation(monkeypatch) -> None:
              worker = _load_worker(monkeypatch)

              greedy = worker._generation_kwargs({"temperature": 0.0, "max_new_tokens": 192})
              assert greedy == {
                  "do_sample": False,
                  "repetition_penalty": 1.05,
                  "max_new_tokens": 192,
              }

              sampled = worker._generation_kwargs({"temperature": 0.2})
              assert sampled["do_sample"] is True
              assert sampled["temperature"] == pytest.approx(0.2)
              assert sampled["top_k"] == 50

              for invalid in (float("nan"), float("inf"), -0.1, True, "0"):
                  with pytest.raises(ValueError, match="temperature"):
                      worker._generation_kwargs({"temperature": invalid})

              generated_with: dict = {}

              class FakeTensor:
                  shape = (1, 3)

              class FakeBatchEncoding(dict):
                  def to(self, device):
                      assert device == "cpu"
                      return self

              class FakeOutput:
                  def __getitem__(self, key):
                      assert key == (0, slice(3, None))
                      return [99]

              class FakeTokenizer:
                  def apply_chat_template(self, messages, **kwargs):
                      assert messages == [{"role": "user", "content": "test"}]
                      assert kwargs == {
                          "add_generation_prompt": True,
                          "tokenize": True,
                          "return_tensors": "pt",
                          "return_dict": True,
                      }
                      return FakeBatchEncoding(
                          input_ids=FakeTensor(),
                          attention_mask=FakeTensor(),
                      )

                  def decode(self, generated, *, skip_special_tokens):
                      assert generated == [99]
                      assert skip_special_tokens is True
                      return '{"text":"ok","voice":{"caption":"natural","emotion":"NEUTRAL","events":[]}}'

              class FakeModel:
                  device = "cpu"

                  def generate(self, **kwargs):
                      assert isinstance(kwargs.pop("input_ids"), FakeTensor)
                      assert isinstance(kwargs.pop("attention_mask"), FakeTensor)
                      generated_with.update(kwargs)
                      return FakeOutput()

              monkeypatch.setattr(worker, "load_base", lambda: (FakeTokenizer(), FakeModel()))
              result = worker.infer(
                  {
                      "messages": [{"role": "user", "content": "test"}],
                      "full_model": None,
                      "adapter": None,
                      "temperature": 0.0,
                      "max_new_tokens": 192,
                  }
              )

              assert result["text"].startswith('{"text":"ok"')
              assert generated_with == greedy

              generated_with.clear()
              worker.infer(
                  {
                      "messages": [{"role": "user", "content": "test"}],
                      "full_model": None,
                      "adapter": None,
                      "temperature": 0.2,
                      "max_new_tokens": 48,
                  }
              )
              assert generated_with == {
                  "do_sample": True,
                  "temperature": pytest.approx(0.2),
                  "top_k": 50,
                  "repetition_penalty": 1.05,
                  "max_new_tokens": 48,
              }

          '''
          # Dedent the source literal from this workflow's Python block.
          import textwrap
          replacement = textwrap.dedent(replacement)
          test.write_text(text[:start] + replacement + text[end + 1 :], encoding="utf-8")
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/lfm/worker.py tests/test_lfm_worker_hardening.py
          git diff --cached --check
          git commit -m "fix: handle LFM BatchEncoding inference"
          git push origin HEAD:26-feature
