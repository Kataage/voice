name: apply-evaluation-embedding-fix-v2

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-evaluation-embedding-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - name: Patch evaluation speaker embedding handling
        shell: python
        run: |
          import textwrap
          from pathlib import Path

          path = Path("src/personavoice/evaluation.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def _identity(")
          end = text.index("\ndef _transcript(", start)
          helper = textwrap.dedent('''\
          def _best_effort_embeddings(
              repo_root: Path,
              items: list[dict[str, str]],
              *,
              label: str,
          ) -> tuple[dict[str, dict[str, Any]], dict[str, str]]:
              """Collect independent pyannote embeddings while failing quality closed.

              Invalid/non-finite worker outputs stay rejected by the worker
              contract, but one bad sample must not erase unrelated ASR,
              pronunciation, duration or emotion metrics. Missing speaker
              metrics remain None so publication still fails closed.
              """

              diarization = worker(repo_root, "diarization")
              results: dict[str, dict[str, Any]] = {}
              errors: dict[str, str] = {}
              for item in items:
                  item_id = str(item.get("id") or "")
                  audio = item.get("audio")
                  if not item_id or not isinstance(audio, str) or not audio:
                      if item_id:
                          errors[item_id] = f"{label}: invalid-request"
                      continue
                  try:
                      value = diarization.call(repo_root, "embed", {"audio": audio})
                  except Exception as exc:
                      reason = (
                          "invalid-response-schema"
                          if "invalid response schema" in str(exc).casefold()
                          else type(exc).__name__
                      )
                      errors[item_id] = f"{label}: {reason}"
                      continue
                  embedding = value.get("embedding") if isinstance(value, dict) else None
                  if not isinstance(embedding, list) or not embedding:
                      errors[item_id] = f"{label}: empty-embedding"
                      continue
                  results[item_id] = value
              return results, errors


          def _identity(
              repo_root: Path,
              paths: PersonaPaths,
          ) -> tuple[list[float] | None, dict[str, str]]:
              refs = [
                  path
                  for path in paths.identity.rglob("*")
                  if path.is_file()
                  and path.suffix.lower() in {".wav", ".flac", ".mp3", ".m4a", ".ogg", ".opus"}
              ][:5]
              if not refs:
                  return None, {}
              results, errors = _best_effort_embeddings(
                  repo_root,
                  [
                      {"id": str(index), "audio": str(path.resolve())}
                      for index, path in enumerate(refs)
                  ],
                  label="identity",
              )
              embeddings = [
                  result["embedding"] for result in results.values() if result.get("embedding")
              ]
              return (mean_embedding(embeddings) if embeddings else None), errors

          ''')
          text = text[:start] + helper + text[end + 1:]

          needle = "    target_embedding = _identity(repo_root, paths)\n"
          if needle not in text:
              raise SystemExit("target embedding call changed unexpectedly")
          text = text.replace(
              needle,
              "    target_embedding, identity_embedding_errors = _identity(repo_root, paths)\n",
              1,
          )

          block_start = text.index('    diar_response = worker(repo_root, "diarization").call(', start)
          block_end = text.index("\n\n    samples: list[EvaluationSample]", block_start)
          new_block = textwrap.indent(textwrap.dedent('''\
          embeddings, speaker_embedding_errors = _best_effort_embeddings(
              repo_root,
              analyzed_items,
              label="evaluation",
          )
          '''), "    ").rstrip()
          text = text[:block_start] + new_block + text[block_end:]

          candidate_lookup = 'embedding = embeddings[candidate_id].get("embedding")'
          mode_lookup = 'embedding = embeddings[item_id].get("embedding")'
          if text.count(candidate_lookup) != 1 or text.count(mode_lookup) != 1:
              raise SystemExit("speaker embedding lookup changed unexpectedly")
          text = text.replace(
              candidate_lookup,
              'embedding = embeddings.get(candidate_id, {}).get("embedding")',
              1,
          )
          text = text.replace(
              mode_lookup,
              'embedding = embeddings.get(item_id, {}).get("embedding")',
              1,
          )

          candidate_row = '                "speaker_similarity": speaker_score,\n                "detected_emotion": acoustic.get("emotion"),'
          if candidate_row not in text:
              raise SystemExit("candidate speaker row changed unexpectedly")
          text = text.replace(
              candidate_row,
              '                "speaker_similarity": speaker_score,\n'
              '                "speaker_embedding_error": speaker_embedding_errors.get(candidate_id),\n'
              '                "detected_emotion": acoustic.get("emotion"),',
              1,
          )

          mode_row = '                    "speaker_similarity": speaker_score,\n                    "detected_emotion": acoustic.get("emotion"),'
          if mode_row not in text:
              raise SystemExit("mode speaker row changed unexpectedly")
          text = text.replace(
              mode_row,
              '                    "speaker_similarity": speaker_score,\n'
              '                    "speaker_embedding_error": speaker_embedding_errors.get(item_id),\n'
              '                    "detected_emotion": acoustic.get("emotion"),',
              1,
          )

          return_tail = '        "candidate_cer_mean": candidate_mean,\n    }\n'
          if return_tail not in text:
              raise SystemExit("voice report return changed unexpectedly")
          text = text.replace(
              return_tail,
              '        "candidate_cer_mean": candidate_mean,\n'
              '        "speaker_embedding_diagnostics": {\n'
              '            "identity": identity_embedding_errors,\n'
              '            "generated": speaker_embedding_errors,\n'
              '        },\n'
              '    }\n',
              1,
          )

          report_tail = '        "candidate_cer_mean": voice_report["candidate_cer_mean"],\n        "lfm": lfm_report,\n'
          if report_tail not in text:
              raise SystemExit("final evaluation report changed unexpectedly")
          text = text.replace(
              report_tail,
              '        "candidate_cer_mean": voice_report["candidate_cer_mean"],\n'
              '        "speaker_embedding_diagnostics": voice_report.get("speaker_embedding_diagnostics", {}),\n'
              '        "lfm": lfm_report,\n',
              1,
          )

          path.write_text(text, encoding="utf-8")
      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile src/personavoice/evaluation.py tests/test_evaluation_embedding_failures.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personavoice/evaluation.py tests/test_evaluation_embedding_failures.py
          git commit -m "fix: isolate evaluation speaker embedding failures"
          git push origin HEAD:26-feature
