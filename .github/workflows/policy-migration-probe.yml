name: policy-portability-integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integration:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/crash-resilient-prepare-batches'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/crash-resilient-prepare-batches
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Sync locked root environment
        run: uv sync --dev --locked
      - name: Apply cross-platform cache policy patch
        run: uv run --locked python scripts/_ci_policy_portability_patch.py
      - name: Bind migration to exact canonical target policy
        shell: bash
        run: |
          TARGET_POLICY="$(uv run --locked python -c 'from personavoice.state import PREPARE_CACHE_POLICY_VERSION; print(PREPARE_CACHE_POLICY_VERSION)')"
          test -n "$TARGET_POLICY"
          TARGET_POLICY="$TARGET_POLICY" uv run --locked python - <<'PY'
          import os
          from pathlib import Path

          path = Path('src/personavoice/state.py')
          text = path.read_text(encoding='utf-8')
          placeholder = '__PERSONAVOICE_CANONICAL_POLICY__'
          if text.count(placeholder) != 1:
              raise SystemExit(f'expected exactly one policy placeholder, found {text.count(placeholder)}')
          path.write_text(
              text.replace(placeholder, os.environ['TARGET_POLICY']),
              encoding='utf-8',
              newline='\n',
          )
          PY
          VERIFIED="$(uv run --locked python -c 'from personavoice.state import PREPARE_CACHE_POLICY_VERSION; print(PREPARE_CACHE_POLICY_VERSION)')"
          test "$VERIFIED" = "$TARGET_POLICY"
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: Commit validated canonical policy
        shell: bash
        run: |
          git rm scripts/_ci_policy_portability_patch.py .github/workflows/policy-migration-probe.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: canonicalize prepare cache policy across OSes"
          git push origin HEAD:fix/crash-resilient-prepare-batches
