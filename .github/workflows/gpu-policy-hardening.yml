name: gpu-policy-hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/pascal-ffmpeg-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pascal-ffmpeg-runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Apply GPU policy hardening
        run: |
          python scripts/_ci_gpu_policy_hardening.py
          python scripts/_ci_gpu_policy_testfix.py
      - name: Sync root test environment
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: Verify audited backend locks remain solvable
        shell: bash
        run: |
          uv sync --project workers/diarization --locked --dry-run --extra cpu
          uv sync --project workers/diarization --locked --dry-run --extra cu126
          uv sync --project workers/diarization --locked --dry-run --extra cu128
          uv sync --project workers/sense --locked --dry-run --extra cpu
          uv sync --project workers/sense --locked --dry-run --extra cu126
          uv sync --project workers/sense --locked --dry-run --extra cu128
          uv sync --project workers/lfm --locked --dry-run --extra cpu
          uv sync --project workers/lfm --locked --dry-run --extra cu126
          uv sync --project workers/lfm --locked --dry-run --extra cu128
      - name: Commit hardened policy
        shell: bash
        run: |
          git rm scripts/_ci_gpu_policy_hardening.py scripts/_ci_gpu_policy_testfix.py .github/workflows/gpu-policy-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: harden GPU swaps and runtime policy"
          git push origin HEAD:fix/pascal-ffmpeg-runtime
