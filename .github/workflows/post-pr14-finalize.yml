name: post-pr14-finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/post-pr14-runtime-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/post-pr14-runtime-hardening
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Normalize and apply integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_ci_post_pr14_hardening.py')
          text = path.read_text(encoding='utf-8')
          if text.endswith("\n''"):
              path.write_text(text[:-3] + "\n", encoding='utf-8', newline='\n')
          PY
          python scripts/_ci_post_pr14_hardening.py
          python scripts/_ci_post_pr14_followup.py
          python scripts/_ci_post_pr14_finalfix.py
      - name: Sync root test environment
        run: uv sync --dev --locked
      - name: Normalize deterministic formatting
        run: uv run --locked ruff check --fix src tests workers
      - name: Ruff
        run: uv run --locked ruff check src tests workers
      - name: Unit tests
        run: uv run --locked pytest
      - name: Compile
        run: uv run --locked python -m compileall -q src tests workers
      - name: Commit integrated hardening
        shell: bash
        run: |
          git rm -f scripts/_ci_post_pr14_hardening.py scripts/_ci_post_pr14_followup.py scripts/_ci_post_pr14_finalfix.py .github/workflows/post-pr14-finalize.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: harden GPU precision and local FFmpeg runtime"
          git push origin HEAD:fix/post-pr14-runtime-hardening
