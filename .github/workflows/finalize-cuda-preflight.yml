name: finalize-cuda-preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/pascal-ffmpeg-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pascal-ffmpeg-runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Integrate preflight into setup transaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/personavoice/setup_env.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from personavoice.atomic import atomic_write_json, atomic_write_text\n'
          new_import = old_import + 'from personavoice.cuda_preflight import run_cuda_preflight\n'
          if text.count(old_import) != 1:
              raise SystemExit('setup_env import anchor is not unique')
          text = text.replace(old_import, new_import, 1)

          old_block = '''    synced = []\n    for name in ("asr", "diarization", "sense", "lfm", "seed_vc"):\n        worker(repo_root, name).sync(repo_root, extra=worker_extras[name])\n        synced.append(name)\n\n    setup_state = {\n'''
          new_block = '''    synced = []\n    for name in ("asr", "diarization", "sense", "lfm", "seed_vc"):\n        worker(repo_root, name).sync(repo_root, extra=worker_extras[name])\n        synced.append(name)\n\n    if selected_gpu is not None:\n        runtime_preflight = run_cuda_preflight(\n            repo_root,\n            irodori_project=irodori,\n            gpu=selected_gpu,\n            worker_backends=worker_extras,\n        )\n    else:\n        runtime_preflight = {\n            "ok": True,\n            "skipped": True,\n            "reason": f"backend {selected_backend} does not use the audited NVIDIA CUDA stack",\n        }\n\n    setup_state = {\n'''
          if text.count(old_block) != 1:
              raise SystemExit('setup_env sync anchor is not unique')
          text = text.replace(old_block, new_block, 1)

          old_state = '        "environment_contract": environment_contract(repo_root),\n        "model_assets": {\n'
          new_state = '        "environment_contract": environment_contract(repo_root),\n        "runtime_preflight": runtime_preflight,\n        "model_assets": {\n'
          if text.count(old_state) != 1:
              raise SystemExit('setup_env state anchor is not unique')
          text = text.replace(old_state, new_state, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Validate root suite
        run: |
          uv sync --dev --locked
          uv run --locked ruff check src tests workers
          uv run --locked pytest
          uv run --locked python -m compileall -q src tests workers
      - name: Commit integrated preflight
        shell: bash
        run: |
          git rm .github/workflows/finalize-cuda-preflight.yml
          git add src/personavoice/setup_env.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: verify CUDA kernels before model downloads"
          git push origin HEAD:fix/pascal-ffmpeg-runtime
