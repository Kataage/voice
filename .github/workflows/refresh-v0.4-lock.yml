name: refresh-v0.4-lock

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/refresh-v0.4-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Refresh lock
        run: uv lock
      - name: Commit lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
          else
            git commit -m "chore: refresh 0.4.0 lock metadata"
            git push origin HEAD:26-feature
          fi
