name: apply-v04-ci-fixes

on:
  push:
    branches: [26-feature]
    paths:
      - .github/workflows/apply-v04-ci-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 26-feature
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv and sync
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          uv sync --dev --locked
      - name: Apply reviewed CI contract fixes
        shell: python
        run: |
          import textwrap
          from pathlib import Path

          # Typer/Rich may split the two option hyphens across ANSI spans.
          path = Path("tests/test_cli_issue26_contract.py")
          text = path.read_text(encoding="utf-8")
          if "import re\n" not in text:
              if "import os\n" not in text:
                  raise SystemExit("CLI imports changed unexpectedly")
              text = text.replace("import os\n", "import os\nimport re\n", 1)
          fn = text.index("def test_cli_help_exposes_executor_and_explicit_migration_commands")
          start = text.index("    assert root_help.exit_code == 0", fn)
          end = text.index("\n\ndef test_migrate_config_never_writes", start)
          assertions = (
              '    assert root_help.exit_code == 0\n'
              '    assert "migrate-config" in root_help.stdout\n'
              '    ansi = re.compile(r"\\x1b\\[[0-?]*[ -/]*[@-~]")\n'
              '    train_visible = ansi.sub("", train_help.stdout)\n'
              '    build_visible = ansi.sub("", build_help.stdout)\n'
              '    assert train_help.exit_code == 0 and "--executor" in train_visible\n'
              '    assert build_help.exit_code == 0 and "--executor" in build_visible\n'
          )
          text = text[:start] + assertions + text[end:]
          path.write_text(text, encoding="utf-8")

          # Evaluation now uses one `embed` worker call per generated sample.
          path = Path("tests/test_evaluation_publication.py")
          text = path.read_text(encoding="utf-8")
          fn = text.index("def test_full_conditioning_comparison_reports_all_required_metrics")
          start = text.index("    class FakeWorker:\n", fn)
          end = text.index("\n    monkeypatch.setattr(evaluation, \"worker\"", start)
          fake = textwrap.indent(
              textwrap.dedent('''\
              class FakeWorker:
                  def __init__(self, name: str) -> None:
                      self.name = name

                  def call(self, repo_root, command, payload):
                      del repo_root
                      if self.name == "diarization":
                          assert command == "embed"
                          assert set(payload) == {"audio"}
                          return {"embedding": [1.0, 0.0]}

                      items = payload.get("items")
                      assert isinstance(items, list)
                      if self.name == "asr":
                          return {
                              "results": [
                                  {
                                      "id": item["id"],
                                      "ok": True,
                                      "result": {
                                          "segments": [
                                              {"text": case_for_item(item["id"])["text"]}
                                          ]
                                      },
                                  }
                                  for item in items
                              ]
                          }
                      assert self.name == "sense"
                      return {
                          "results": [
                              {
                                  "id": item["id"],
                                  "ok": True,
                                  "result": {
                                      "emotion": case_for_item(item["id"])["emotion"],
                                      "events": [],
                                  },
                              }
                              for item in items
                          ]
                      }
              '''),
              "    ",
          ).rstrip()
          text = text[:start] + fake + text[end:]
          old = '    monkeypatch.setattr(evaluation, "_identity", lambda repo_root, paths: [1.0, 0.0])\n'
          new = '    monkeypatch.setattr(evaluation, "_identity", lambda repo_root, paths: ([1.0, 0.0], {}))\n'
          if text.count(old) != 1:
              raise SystemExit("evaluation identity fake changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Full-model regression should emulate the real BatchEncoding API.
          path = Path("tests/test_lfm_full_training.py")
          text = path.read_text(encoding="utf-8")
          fn = text.index("def test_worker_verifies_and_uses_full_model_without_loading_peft")
          start = text.index("    class InputIds:\n", fn)
          end = text.index("\n    monkeypatch.setattr(worker, \"load_full_model\"", start)
          fake = textwrap.indent(
              textwrap.dedent('''\
              class InputIds:
                  shape = (1, 2)

              class BatchEncoding(dict):
                  def to(self, device):
                      assert device == "cpu"
                      return self

              class Output:
                  def __getitem__(self, index):
                      assert index == (0, slice(2, None))
                      return "generated"

              class Tokenizer:
                  def apply_chat_template(self, *_args, **kwargs):
                      assert kwargs["return_dict"] is True
                      return BatchEncoding(input_ids=InputIds())

                  def decode(self, _tokens, **_kwargs):
                      return "full result"

              class Model:
                  device = "cpu"

                  def generate(self, **kwargs):
                      assert isinstance(kwargs.pop("input_ids"), InputIds)
                      return Output()
              '''),
              "    ",
          ).rstrip()
          path.write_text(text[:start] + fake + text[end:], encoding="utf-8")

          # Freeze the v0.3 model contract: future asset upgrades must not alter
          # the fingerprint set used to adopt a verified v0.3 training stage.
          path = Path("src/personavoice/training.py")
          text = path.read_text(encoding="utf-8")
          marker = "_LEGACY_V03_TRAIN_SCHEMA = 8\n"
          frozen = (
              '_LEGACY_V03_TRAIN_SCHEMA = 8\n'
              '_LEGACY_V03_MODEL_CONTRACT = {\n'
              '    "irodori_source_revision": "8224dafb46d0aba89209a8f905f1cb7e3299d9c1",\n'
              '    "irodori_model_sha256": "c85de88c01700cb53538e706f128ebcb1b8513ad21d7d0e75f58bc82cdbf89f6",\n'
              '    "irodori_dacvae_sha256": "db120339c5ee7eca1912cdf29bc612b947a0808e69c3cebfb4936b45a762c1d5",\n'
              '    "irodori_text_encoder_revision": "77675fc96a7e445e982e2ba90246b816efc74ec6",\n'
              '    "lfm_revision": "b31023f2d69b95fbd7876898f8de9fae90e8afbd",\n'
              '    "seed_vc_source_revision": "51383efd921027683c89e5348211d93ff12ac2a8",\n'
              '}\n'
          )
          if "_LEGACY_V03_MODEL_CONTRACT" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("legacy schema marker changed unexpectedly")
              text = text.replace(marker, frozen, 1)
          old = (
              '        model_contract = {\n'
              '            "irodori_source_revision": IRODORI_REVISION,\n'
              '            "irodori_model_sha256": IRODORI_MODEL_SHA256,\n'
              '            "irodori_dacvae_sha256": IRODORI_DACVAE_SHA256,\n'
              '            "irodori_text_encoder_revision": IRODORI_TEXT_ENCODER_REVISION,\n'
              '            "lfm_revision": LFM_MODEL_REVISION,\n'
              '            "seed_vc_source_revision": SEED_VC_REVISION,\n'
              '            **file_contract,\n'
              '        }\n'
          )
          new = (
              '        model_contract = {\n'
              '            **_LEGACY_V03_MODEL_CONTRACT,\n'
              '            **file_contract,\n'
              '        }\n'
          )
          if text.count(old) != 1:
              raise SystemExit("legacy model reconstruction changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # These values are independently reproduced by the tagged v0.3.0
          # _fingerprint implementation for the synthetic fixture below.
          path = Path("tests/test_training_config_migration.py")
          text = path.read_text(encoding="utf-8")
          old_a = "389dad1e6ea1f4dc6020a2307075aa322fa68213cfb4b79df39e8209efae116b"
          old_b = "9f0d36409e20fa83a07259dc8df89f54b768755e9e427152565b1bbd9a55e128"
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit("legacy fingerprint expectations changed unexpectedly")
          text = text.replace(old_a, "2c06e9a51edbf6bed95492a94cc115c011fd7204a87ddbee3ee1c916f87f8e44", 1)
          text = text.replace(old_b, "5f251f84d110e0d33083e0dd21d1756b09b60bb72c307f4f795f84fbdcf12877", 1)
          path.write_text(text, encoding="utf-8")
      - name: Validate targeted failures
        run: |
          uv run --locked pytest \
            tests/test_cli_issue26_contract.py::test_cli_help_exposes_executor_and_explicit_migration_commands \
            tests/test_evaluation_publication.py::test_full_conditioning_comparison_reports_all_required_metrics \
            tests/test_lfm_full_training.py::test_worker_verifies_and_uses_full_model_without_loading_peft \
            tests/test_training_config_migration.py::test_v03_artifact_adoption_requires_exact_completed_input_and_config_lineage
      - name: Full validation
        run: |
          uv run --locked ruff check src tests workers
          uv run --locked pytest
          uv run --locked python -m compileall -q src workers tests
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personavoice/training.py tests/test_cli_issue26_contract.py tests/test_evaluation_publication.py tests/test_lfm_full_training.py tests/test_training_config_migration.py
          git commit -m "test: align v0.4 contracts with hardened runtime"
          git push origin HEAD:26-feature
